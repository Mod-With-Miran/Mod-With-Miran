name: Profile Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile automation script
        run: python -m py_compile scripts/update_profile.py

      - name: Verify README automation markers
        shell: bash
        run: |
          grep -q '<!-- AUTO:RECENT-START -->' README.md
          grep -q '<!-- AUTO:RECENT-END -->' README.md

      - name: Validate configuration JSON
        run: python -m json.tool config/profile.json >/dev/null
